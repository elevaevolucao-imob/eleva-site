name: Publicar site
on:
  push:
    branches: [conteudo]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
# Por padrao nada pode escrever; so o job abaixo recebe permissao, e so de conteudo do repositorio.
permissions:
  contents: read
concurrency:
  group: publicar
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Acoes de terceiros travadas pelo codigo exato (SHA), nao por etiqueta que pode ser trocada.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: conteudo
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Instalar bibliotecas
        run: |
          python -m pip install --quiet --only-binary=:all: -r ferramentas/requisitos.txt
      - name: Buscar avaliacoes de 5 estrelas no Google
        continue-on-error: true
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: python ferramentas/atualizar_depoimentos.py
      - name: Gerar o site a partir das pastas
        run: python ferramentas/gerar.py _site
      - name: Publicar (branch main, servido pelo GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b main
          git config user.name "Eleva Site"
          git config user.email "site@users.noreply.github.com"
          git add -A
          git commit -q -m "Site publicado a partir de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
      - name: Guardar depoimentos novos
        continue-on-error: true
        run: |
          git config user.name "Eleva Site"
          git config user.email "site@users.noreply.github.com"
          git add site/depoimentos.json
          git diff --cached --quiet || (git commit -q -m "Depoimentos de 5 estrelas atualizados" && git pull -q --rebase origin conteudo && git push -q origin HEAD:conteudo)
